waypoint_mission:
  ros__parameters:
    # ENU metres relative to the spawn/takeoff origin: east, north, up.
    # First leg must pass around box2; second leg around the north end of box1.
    waypoints: [0.0, 8.0, 2.5, 8.0, 8.0, 2.5, 8.0, 0.0, 2.5]
    takeoff_height: 2.5
    map_min: [-15.0, -16.0, 0.8]
    map_max: [25.0, 18.0, 4.0]
    resolution: 0.4
    safety_radius: 0.65
    max_velocity: 1.0
    max_acceleration: 0.7
    max_jerk: 1.5
    auto_start: false
    land_at_end: true
    # --mid360 enables this automatically. Only short-lived local obstacles; no SLAM.
    lidar_enabled: false
    lidar_topic: /lidar/points
    lidar_frame: mid360_link
    # Current scene spawns with ENU yaw 0. Correct the initial EKF heading bias once.
    lidar_align_spawn_yaw: true
    lidar_spawn_yaw_enu: 0.0
    lidar_register_known_walls: true
    lidar_replan_margin: 0.2
    lidar_range: 8.0
    lidar_min_range: 0.45
    lidar_ground_height: 0.15
    lidar_voxel_size: 0.3
    lidar_margin: 0.15
    lidar_memory: 0.6
    lidar_timeout: 0.5
    lidar_lookahead: 6.0
    lidar_max_voxels: 6000
    replan_timeout: 30.0
